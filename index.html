<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tasty Bite Restaurant</title>
    <link rel="stylesheet" href="Design.css">
</head>

<body >
<header>

  <h1 id="home"> Tasty Bite </h1>
  <p>Welcome to Our Restaurant!</p>
</header>

<div>
  <a href="#home">Home </a>
  <a href="#menu">Menu</a>
  <a href="#order">Order</a>
  <a href="#contact">Contact</a>
</div>



<hr>

<section id="menu">
  <h2 >Our Menu</h2>

  <h3>Cheese Burger</h3>
  <img src="imge . html 1.jpg" width="30%">
  <p>Price: <b>150 EGP</b></p>
  <br>
  <h3>Pizza</h3>
  <img src="imge . html 2.jpg" width="30%">
  <p>Price: <b>200 EGP</b></p>
  <br>
  <h3>French Fries</h3>
  <img src="imge . html 3.jpg" width="30%">
  <p>Price: <b>60 EGP</b></p>
  <br>
  <h3>Fresh Juice</h3>
  <img src="imge . html 4.jpg" width="30%">
  <p>Price: <b>50 EGP</b></p>
  <hr>
</section>

<section>
   <h2 id="order">Make Your Order</h2>
  <form>

    <label for="name">Your Name:</label>
    <input type="text" name="name" id="name">
    <br><br>

    <label for="phone">Phone Number:</label>
    <input type="tel" name="phone" id="phone">
    <br><br>

    <label for="meal">Choose Your Meal:</label>
    <select>
        <option value="Burger" selected>Burger</option>
        <option value="Pizza">Pizza</option>
        <option value="Fries">Fries</option>
        <option value="Juice">Juice</option>
    </select>
    <br><br>

    <label for="Quantity">Quantity:</label>
    <input type="number" name="Quantity" id="Quantity">
    <br><br>
    <label for="Special">Special Instructions:</label>
    
    <textarea name="Special" id="Special"></textarea>
    <br><br>
    <button type="submit">Order Now</button>
    <hr>
  </form>
</section>


<footer>
 <h2 id="contact">Contact</h2>
 <p>Phone: 01111111111</p>
 <p>Location: Cairo, Egypt</p>
 <p>Thank you for visiting!</p>
</footer>

</body>
</html>
